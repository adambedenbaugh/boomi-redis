plugins {
    id 'java'
    id 'base'
    id 'com.boomi.connector' version '0.3.4'
    id 'java-library'
    id 'com.github.ben-manes.versions' version '0.52.0'
}

connector {
    className = 'com.boomi.connector.redis.RedisConnector'
}

tasks.named('connectorConfig').configure {
    doLast {
        println "Connector config task completed"
        project.file('build').eachFileRecurse { file ->
            if (file.name == 'connector-config.xml') {
                println "Found connector-config.xml at: ${file.absolutePath}"
            }
        }
    }
}

base {
    archivesName = 'BoomiRedisConnector'
}
group = 'com.boomi.connector.redis'
version = '1.1.0'

ext {
    sdkBoomiVersion = '2.22.1'
}

compileTestJava.dependsOn connectorConfig
compileTestJava.dependsOn connectorOverridesFile

java {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

repositories {
    mavenCentral()
    maven {
        name = "Connector SDK Repository"
        url = "https://boomisdk.s3.amazonaws.com/releases"
    }
}

dependencies {
    api group: 'com.boomi.connsdk', name: 'connector-sdk-api', version: sdkBoomiVersion
    api group: 'com.boomi.connsdk', name: 'connector-sdk-util', version: sdkBoomiVersion
    implementation group: 'com.boomi.util', name: 'boomi-util', version: sdkBoomiVersion
    
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.13.1'
    implementation group: 'org.apache.commons', name: 'commons-pool2', version: '2.12.1'
    // Using Jedis 5.2.0 because it supports Redis 6 and above, which includes Azure Cache for Redis
    implementation group: 'redis.clients', name: 'jedis', version: '5.2.0'

    testImplementation group: 'com.boomi.connsdk', name: 'connector-sdk-test-util', version: sdkBoomiVersion
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation group: 'org.mockito', name: 'mockito-inline', version: '4.11.0'
    testImplementation group: 'org.testcontainers', name: 'testcontainers', version: '1.21.4'
}

test {
    useJUnit {
        excludeCategories 'com.boomi.connector.redis.IntegrationTest'
    }
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
    jvmArgs = []
}

task integrationTest(type: Test) {
    useJUnit {
        includeCategories 'com.boomi.connector.redis.IntegrationTest'
    }
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
    description = 'Run integration tests (requires a live Redis or Azure Redis instance)'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    testClassesDirs = sourceSets.test.output.classesDirs
}

jar {
    archiveBaseName = base.archivesName
}

connectorArchive {
    archiveBaseName = base.archivesName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    into('/lib') {
        from configurations.runtimeClasspath
        from 'lib'
    }
}

task copyUploadArtifacts(type: Copy) {
    destinationDir = file("$buildDir/connector-upload")
    from connectorArchive
    from fileTree("src/main/resources/META-INF").files, {
        include "connector-descriptor.xml"
        include "connector-config.xml"
    }
    //from fileTree("src/main/resources/schemas").files
}

build.dependsOn copyUploadArtifacts

